{% extends "base.html" %}

{% block title %}Каталог - 2SOUL{% endblock %}

{% block content %}
<section class="catalog">
    <div class="container">
        <h1 class="catalog-title">Каталог товаров</h1>
        
        <div class="catalog-layout">
            <!-- Sidebar Filters -->
            <aside class="catalog-sidebar">
                <div class="filter-group">
                    <h3>Поиск</h3>
                    <input 
                        type="text" 
                        id="search-input" 
                        class="search-input" 
                        placeholder="Введите название..."
                    >
                </div>
                
                <div class="filter-group">
                    <h3>Категория</h3>
                    <div class="category-filters" id="category-filters">
                        <!-- Load via JS -->
                    </div>
                </div>
                
                <div class="filter-group">
                    <h3>Цена</h3>
                    <input 
                        type="range" 
                        id="price-filter" 
                        min="0" 
                        max="100000" 
                        value="100000"
                        class="price-range"
                    >
                    <div class="price-display">
                        до <span id="price-value">100000</span> ₽
                    </div>
                </div>
                
                <button class="btn btn-primary" id="clear-filters" style="width: 100%;">
                    Очистить фильтры
                </button>
            </aside>

            <!-- Products Grid -->
            <div class="catalog-main">
                <div class="sort-controls">
                    <select id="sort-select" class="sort-select">
                        <option value="newest">Новые</option>
                        <option value="price-asc">Цена: от низкой</option>
                        <option value="price-desc">Цена: от высокой</option>
                        <option value="popular">Популярные</option>
                    </select>
                </div>
                
                <div class="products-grid" id="products-grid">
                    <p style="grid-column: 1/-1; text-align: center; color: #999;">⏳ Загрузка товаров...</p>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Product Detail Modal -->
<div class="modal" id="product-modal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeProductModal()">×</button>
        <div class="modal-body" id="modal-body">
            <!-- Product details load here -->
        </div>
    </div>
</div>

<script>
// ==================== CATALOG SCRIPT ====================

let allProducts = [];
let activeFilters = {
    search: '',
    category: 'all',
    maxPrice: 100000
};

// Логирование
const log = (msg, data) => {
    console.log(`[CATALOG] ${msg}`, data || '');
};

log('✅ Script loaded');

// ==================== LOAD PRODUCTS ====================

function loadProducts() {
    log('🔄 Loading products from API...');
    
    fetch('/api/products', {
        method: 'GET',
        headers: {
            'Content-Type': 'application/json'
        }
    })
    .then(response => {
        log(`📡 API Response status: ${response.status}`);
        
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        return response.json();
    })
    .then(data => {
        log('✅ Products received', data.products.length + ' products');
        
        if (!data.products || !Array.isArray(data.products)) {
            log('❌ ERROR: data.products is not an array', data);
            document.getElementById('products-grid').innerHTML = `
                <p style="grid-column: 1/-1; text-align: center; color: #dc3545;">
                    ❌ Ошибка: Неверный формат данных
                </p>
            `;
            return;
        }
        
        log(`📦 Total products: ${data.products.length}`);
        
        allProducts = data.products;
        
        if (allProducts.length === 0) {
            log('⚠️ No products in database');
            document.getElementById('products-grid').innerHTML = `
                <p style="grid-column: 1/-1; text-align: center; color: #999;">
                    📭 Товары отсутствуют
                </p>
            `;
            return;
        }
        
        // Update max price
        const maxPrice = Math.max(...allProducts.map(p => p.price));
        log(`💰 Max price found: ${maxPrice}`);
        
        document.getElementById('price-filter').max = Math.ceil(maxPrice * 1.1);
        activeFilters.maxPrice = Math.ceil(maxPrice * 1.1);
        document.getElementById('price-filter').value = activeFilters.maxPrice;
        document.getElementById('price-value').textContent = activeFilters.maxPrice;
        
        // Render products
        renderProducts();
        log('✅ Products loaded and rendered successfully');
    })
    .catch(error => {
        log('❌ FETCH ERROR', error.message);
        console.error('Full error:', error);
        
        document.getElementById('products-grid').innerHTML = `
            <p style="grid-column: 1/-1; text-align: center; color: #dc3545;">
                ❌ Ошибка при загрузке товаров: ${error.message}
            </p>
        `;
    });
}

// ==================== LOAD CATEGORIES ====================

function loadCategories() {
    log('🔄 Loading categories from API...');
    
    fetch('/api/categories', {
        method: 'GET',
        headers: {
            'Content-Type': 'application/json'
        }
    })
    .then(response => {
        log(`📡 Categories API Response status: ${response.status}`);
        
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        return response.json();
    })
    .then(data => {
        log('✅ Categories received', data.categories.length + ' categories');
        
        const container = document.getElementById('category-filters');
        if (!container) {
            log('❌ ERROR: category-filters container not found');
            return;
        }
        
        container.innerHTML = '';
        
        // Add "All" option
        const allLabel = document.createElement('label');
        allLabel.className = 'category-checkbox';
        allLabel.innerHTML = `
            <input type="radio" name="category" value="all" checked onchange="filterProducts()">
            <span>Все категории</span>
        `;
        container.appendChild(allLabel);
        log('✓ Added "All categories" option');
        
        // Add categories
        if (data.categories && Array.isArray(data.categories)) {
            log(`📂 Found ${data.categories.length} categories`);
            
            data.categories.forEach(category => {
                const label = document.createElement('label');
                label.className = 'category-checkbox';
                label.innerHTML = `
                    <input type="radio" name="category" value="${category}" onchange="filterProducts()">
                    <span>${category}</span>
                `;
                container.appendChild(label);
            });
            
            log(`✓ Added ${data.categories.length} category buttons`);
        } else {
            log('⚠️ No categories in response');
        }
    })
    .catch(error => {
        log('❌ CATEGORIES FETCH ERROR', error.message);
        console.error('Full error:', error);
    });
}

// ==================== ATTACH LISTENERS ====================

function attachFilterListeners() {
    log('🔌 Attaching filter listeners...');
    
    const searchInput = document.getElementById('search-input');
    const priceFilter = document.getElementById('price-filter');
    const sortSelect = document.getElementById('sort-select');
    const clearBtn = document.getElementById('clear-filters');
    
    if (!searchInput || !priceFilter || !sortSelect || !clearBtn) {
        log('❌ ERROR: Some filter elements not found');
        return;
    }
    
    searchInput.addEventListener('input', () => {
        log('🔍 Search input changed');
        filterProducts();
    });
    
    priceFilter.addEventListener('change', (e) => {
        activeFilters.maxPrice = parseInt(e.target.value);
        document.getElementById('price-value').textContent = e.target.value;
        log('💰 Price filter changed', activeFilters.maxPrice);
        filterProducts();
    });
    
    sortSelect.addEventListener('change', () => {
        log('🔀 Sort changed');
        renderProducts();
    });
    
    clearBtn.addEventListener('click', (e) => {
        e.preventDefault();
        log('🔄 Clearing filters');
        clearFilters();
    });
    
    log('✓ All listeners attached');
}

// ==================== FILTER PRODUCTS ====================

function filterProducts() {
    log('📊 Filtering products...');
    
    activeFilters.search = document.getElementById('search-input').value.toLowerCase();
    
    const categoryRadio = document.querySelector('input[name="category"]:checked');
    activeFilters.category = categoryRadio ? categoryRadio.value : 'all';
    
    activeFilters.maxPrice = parseInt(document.getElementById('price-filter').value);
    
    log('Active filters', activeFilters);
    
    renderProducts();
}

// ==================== RENDER PRODUCTS ====================

function renderProducts() {
    log('🎨 Rendering products...');
    log('All products count:', allProducts.length);
    
    if (allProducts.length === 0) {
        log('❌ ERROR: allProducts is empty!');
        return;
    }
    
    let filtered = allProducts.filter(product => {
        const matchesSearch = product.name.toLowerCase().includes(activeFilters.search) ||
                            (product.description && product.description.toLowerCase().includes(activeFilters.search));
        const matchesCategory = activeFilters.category === 'all' || 
                               product.category === activeFilters.category;
        const matchesPrice = product.price <= activeFilters.maxPrice;
        
        return matchesSearch && matchesCategory && matchesPrice;
    });
    
    log(`Filtered products: ${filtered.length}`);
    
    // Sort
    const sort = document.getElementById('sort-select').value;
    if (sort === 'price-asc') {
        filtered.sort((a, b) => a.price - b.price);
        log('✓ Sorted by price ascending');
    } else if (sort === 'price-desc') {
        filtered.sort((a, b) => b.price - a.price);
        log('✓ Sorted by price descending');
    }
    
    const grid = document.getElementById('products-grid');
    
    if (!grid) {
        log('❌ ERROR: products-grid not found');
        return;
    }
    
    grid.innerHTML = '';
    
    if (filtered.length === 0) {
        log('📭 No products match filters');
        grid.innerHTML = '<p class="no-products" style="grid-column: 1/-1;">🔍 Товары не найдены</p>';
        return;
    }
    
    log(`✓ Rendering ${filtered.length} products`);
    
    filtered.forEach((product, index) => {
        try {
            const card = document.createElement('div');
            card.className = 'product-card-large';
            card.id = `product-${product.id}`;
            
            const imageUrl = product.image_url || 'https://via.placeholder.com/300?text=Product';
            const description = product.description ? product.description.substring(0, 100) : 'Описание товара';
            
            card.innerHTML = `
                <div class="product-image">
                    <img src="${imageUrl}" 
                         alt="${product.name}"
                         onerror="this.src='https://via.placeholder.com/300?text=Product'">
                </div>
                <div class="product-details">
                    <h3>${product.name}</h3>
                    <p class="category-badge">${product.category}</p>
                    <p class="description">${description}...</p>
                    <p class="price">₽${product.price.toLocaleString()}</p>
                    <button class="btn btn-primary" onclick="showProductDetail(${product.id})">
                        Выбрать
                    </button>
                </div>
            `;
            
            grid.appendChild(card);
            
            if (index === 0) {
                log(`✓ First product added: ${product.name}`);
            }
        } catch (e) {
            log(`❌ Error rendering product ${product.id}:`, e.message);
        }
    });
    
    log(`✅ Rendering complete: ${filtered.length} products displayed`);
}

// ==================== PRODUCT DETAIL ====================

function showProductDetail(productId) {
    log(`👁️ Showing detail for product ${productId}`);
    
    const product = allProducts.find(p => p.id === productId);
    if (!product) {
        log(`❌ Product ${productId} not found`);
        return;
    }
    
    log(`Found product: ${product.name}`);
    
    const modal = document.getElementById('product-modal');
    const body = document.getElementById('modal-body');
    
    if (!modal || !body) {
        log('❌ Modal or body not found');
        return;
    }
    
    const sizesHTML = product.sizes && product.sizes.length > 0 
        ? product.sizes.map(size => `
            <button class="size-btn" data-size="${size}">${size}</button>
        `).join('')
        : '<button class="size-btn" data-size="One Size">One Size</button>';
    
    body.innerHTML = `
        <div class="product-detail">
            <div class="detail-image">
                <img src="${product.image_url || 'https://via.placeholder.com/300?text=Product'}" 
                     alt="${product.name}"
                     onerror="this.src='https://via.placeholder.com/300?text=Product'">
            </div>
            <div class="detail-info">
                <h2>${product.name}</h2>
                <p class="detail-category">${product.category}</p>
                <p class="detail-description">${product.description}</p>
                <p class="detail-price">₽${product.price.toLocaleString()}</p>
                
                <div class="size-selector">
                    <label>Размер:</label>
                    <div class="sizes">
                        ${sizesHTML}
                    </div>
                </div>
                
                <div class="quantity-selector">
                    <label>Количество:</label>
                    <div class="quantity-input">
                        <button type="button" onclick="decreaseQty()">−</button>
                        <input type="number" id="qty-input" value="1" min="1" max="${product.stock}">
                        <button type="button" onclick="increaseQty()">+</button>
                    </div>
                </div>
                
                <button class="btn btn-primary btn-large" onclick="addToCart(${product.id})">
                    🛒 Добавить в корзину
                </button>
                <p class="stock-info">✓ В наличии: ${product.stock} шт.</p>
            </div>
        </div>
    `;
    
    modal.style.display = 'flex';
    log('✓ Modal opened');
    
    // Size selection
    const sizeBtns = body.querySelectorAll('.size-btn');
    sizeBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            sizeBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
        });
    });
    
    if (sizeBtns.length > 0) {
        sizeBtns[0].click();
    }
}

function closeProductModal() {
    document.getElementById('product-modal').style.display = 'none';
}

function increaseQty() {
    const input = document.getElementById('qty-input');
    const maxStock = parseInt(input.max);
    if (parseInt(input.value) < maxStock) {
        input.value = parseInt(input.value) + 1;
    }
}

function decreaseQty() {
    const input = document.getElementById('qty-input');
    if (input.value > 1) {
        input.value = parseInt(input.value) - 1;
    }
}

function addToCart(productId) {
    log(`🛒 Adding product ${productId} to cart`);
    
    const product = allProducts.find(p => p.id === productId);
    if (!product) {
        log(`❌ Product ${productId} not found`);
        return;
    }
    
    const qty = parseInt(document.getElementById('qty-input').value);
    const sizeBtn = document.querySelector('.size-btn.active');
    const size = sizeBtn ? sizeBtn.dataset.size : 'One Size';
    
    log(`Adding: ${product.name}, Qty: ${qty}, Size: ${size}`);
    
    fetch('/api/cart/add', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            product_id: productId,
            quantity: qty,
            size: size
        })
    })
    .then(response => response.json())
    .then(data => {
        log('✅ Add to cart response', data);
        
        if (data.success) {
            showNotification('✓ Товар добавлен в корзину!', 'success');
            updateCartCount();
            closeProductModal();
        } else {
            showNotification('✗ ' + data.message, 'danger');
        }
    })
    .catch(error => {
        log('❌ ADD TO CART ERROR', error.message);
        showNotification('✗ Ошибка при добавлении товара', 'danger');
    });
}

function clearFilters() {
    log('🔄 Clearing all filters');
    
    document.getElementById('search-input').value = '';
    
    const allRadio = document.querySelector('input[value="all"]');
    if (allRadio) {
        allRadio.checked = true;
    }
    
    document.getElementById('price-filter').value = activeFilters.maxPrice;
    document.getElementById('price-value').textContent = activeFilters.maxPrice;
    
    filterProducts();
}

// Click outside modal to close
window.onclick = function(event) {
    const modal = document.getElementById('product-modal');
    if (event.target === modal) {
        modal.style.display = 'none';
    }
}

// ==================== INITIALIZATION ====================

// Инициализация СРАЗУ при загрузке скрипта
log('🚀 Starting initialization...');

// Загружаем товары и категории сразу
loadProducts();
loadCategories();

// Присоединяем слушателей событий
if (document.readyState === 'loading') {
    // DOM еще загружается
    document.addEventListener('DOMContentLoaded', function() {
        log('📄 DOM Content Loaded');
        attachFilterListeners();
    });
} else {
    // DOM уже загружен
    log('📄 DOM already loaded');
    attachFilterListeners();
}

log('✅ Initialization script complete');
</script>
{% endblock %}
